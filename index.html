<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snake Neon</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.min.js"></script>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/addons/p5.sound.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #0a0a0f;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow-y: auto;   /* allow scroll if needed */
      overflow-x: hidden;
      min-height: 100vh;
      padding: 8px 0;
    }
    canvas { display: block; margin: 0 auto; touch-action: none; }

    #topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: monospace;
      color: #00d9ff;
      font-size: 13px;
      min-height: 24px;
    }
    #pauseBtn {
      background: #12121f;
      border: 2px solid #1a1a2e;
      border-radius: 8px;
      color: #00d9ff;
      padding: 4px 14px;
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #pauseBtn:active { box-shadow: 0 0 12px #00d9ff; }

    /* ============================================================
       MOBILE CONTROLS V2 — Portrait Tap Zone + Landscape Gamepad
       ============================================================ */
    /* Hidden by default (portrait / desktop) */
    .gamepad-hidden { display: none !important; }
    .start-hidden { display: none !important; }

    /* Landscape body layout: 3 columns — D-pad | canvas | start */
    body.landscape {
      flex-direction: row;
      align-items: stretch;
      justify-content: space-between;
      padding: 0;
      gap: 0;
      min-height: 100vh;
    }
    /* Topbar spans full width above the 3-column row in landscape.
       We keep it in flex flow but it's a thin row. To get 3 columns
       underneath, we wrap via CSS grid on body. */
    body.landscape {
      display: grid;
      grid-template-columns: 30% 1fr 24%;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "topbar topbar topbar"
        "gamepad canvas start";
      gap: 4px;
      padding: 4px;
    }
    body.landscape #topbar    { grid-area: topbar; }
    body.landscape #gamepad   { grid-area: gamepad; display: flex !important;
                                  align-items: center; justify-content: center; }
    body.landscape canvas     { grid-area: canvas; align-self: center;
                                  justify-self: center; margin: 0 !important; }
    body.landscape #startBtn  { grid-area: start; display: flex !important;
                                  align-items: center; justify-content: center; }

    /* D-pad — cross layout 56x56px buttons, 4px gap */
    #dpad {
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 4px;
      /* Cross shape: center cell empty, buttons at N/E/S/W */
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
    }
    .dpad-up    { grid-area: up; }
    .dpad-left  { grid-area: left; }
    .dpad-right { grid-area: right; }
    .dpad-down  { grid-area: down; }
    .dpad-btn {
      width: 56px; height: 56px;
      background: #12121f;
      border: 2px solid #1a1a2e;
      border-radius: 10px;
      color: #00ff88;
      font-size: 22px;
      font-family: monospace;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      display: flex; align-items: center; justify-content: center;
      transition: box-shadow 0.1s;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 0 12px #00ff88;
      border-color: #00ff88;
    }

    /* Start/Pause button — round 72px, right column */
    #startBtn {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #12121f;
      border: 2px solid #1a1a2e;
      color: #00d9ff;
      font-size: 28px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: box-shadow 0.1s;
    }
    #startBtn:active, #startBtn.pressed {
      box-shadow: 0 0 16px #00d9ff;
      border-color: #00d9ff;
    }
  </style>
</head>
<body>
<div id="topbar">
  <span id="hud-score"></span>
  <button id="pauseBtn">⏸ PAUSE</button>
</div>
<!-- Landscape gamepad: D-pad left column -->
<div id="gamepad" class="gamepad-hidden">
  <div id="dpad">
    <button class="dpad-btn dpad-up" data-dir="UP" aria-label="Up">▲</button>
    <button class="dpad-btn dpad-left" data-dir="LEFT" aria-label="Left">◀</button>
    <button class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="Right">▶</button>
    <button class="dpad-btn dpad-down" data-dir="DOWN" aria-label="Down">▼</button>
  </div>
</div>
<!-- Landscape start/pause button: right column -->
<button id="startBtn" class="start-hidden" aria-label="Start/Pause">⏸</button>
<script>
// ============================================================
// SNAKE NEON — P0 MVP
// Based on docs/architecture.md spec
// ============================================================

// ============================================================
// CONFIG — Constants (§13.1)
// ============================================================
const INITIAL_COLS = 17;
const INITIAL_ROWS = 17;
const MAX_COLS = 41;
const MAX_ROWS = 41;
const EXPAND_PER_FOOD = 1;

// COLS/ROWS are mutable — Territory Expansion grows the grid each food (§3).
let COLS = INITIAL_COLS;
let ROWS = INITIAL_ROWS;
const START_LENGTH = 3;
const START_X = Math.floor(INITIAL_COLS / 2);
const START_Y = Math.floor(INITIAL_ROWS / 2);

const INITIAL_TICK   = 150;
const MIN_TICK       = 60;
const STEP_REDUCTION = 3;

const BASE_POINTS = 10;

// Joystick direction threshold (responsive — recalculated from cellSize at render time)
const JOYSTICK_THRESHOLD_RATIO = 0.4;  // threshold = cellSize * 0.4
const JOYSTICK_BASE_RATIO = 1.5;       // base radius = cellSize * 1.5
const JOYSTICK_THUMB_RATIO = 0.8;      // thumb radius = cellSize * 0.8

// Floating Virtual Joystick state (Option A — mobile-ux-redesign.md §4)
// V2: joystick RETAINED as swipe-fallback only (portrait). Primary portrait
// control is now the 4-triangle tap zone. Landscape uses D-pad buttons.
let joystick = {
  active: false,
  originX: 0, originY: 0,   // touch start point
  thumbX: 0, thumbY: 0      // current thumb position (clamped to base)
};

// Mobile Controls V2 orientation state
let currentOrientation = 'portrait';  // 'portrait' | 'landscape'

const MAX_PARTICLES = 50;
const PARTICLE_LIFE = 300;

const HS_KEY   = 'snake_neon_highscore';
const MUTE_KEY = 'snake_neon_muted';

// ============================================================
// PALETTE — Neon Aesthetic (§10.1)
// ============================================================
const PALETTE = {
  bg:        '#0a0a0f',
  snake:     '#00ff88',
  snakeHead: '#33ffaa',
  food:      '#ff006e',
  grid:      '#1a1a2e',
  scoreText: '#00d9ff',
  accent:    '#ffee00',
  white:     '#ffffff',
  spike:     '#ff2244'
};

// ============================================================
// STATE MACHINE (§3.3)
// ============================================================
const STATES = {
  MENU:      'MENU',
  PLAYING:   'PLAYING',
  PAUSED:    'PAUSED',
  GAME_OVER: 'GAME_OVER'
};

const TRANSITIONS = {
  MENU:      { PLAYING: true },
  PLAYING:   { PAUSED: true, GAME_OVER: true },
  PAUSED:    { PLAYING: true },
  GAME_OVER: { MENU: true, PLAYING: true }
};

let currentState = STATES.MENU;

function transitionTo(newState) {
  if (!TRANSITIONS[currentState] || !TRANSITIONS[currentState][newState]) return;
  onExit(currentState);
  currentState = newState;
  onEnter(newState);
  if (newState === STATES.GAME_OVER) {
    playDeathSFX();
  }
}

function onExit(state) {}

function onEnter(state) {
  if (state === STATES.PLAYING) {
    lastFrameTime = millis();
    tickAccumulator = 0;
  }
}

// ============================================================
// DIRECTIONS (§5.2)
// ============================================================
const DIR = {
  UP:    { x:  0, y: -1 },
  DOWN:  { x:  0, y:  1 },
  LEFT:  { x: -1, y:  0 },
  RIGHT: { x:  1, y:  0 }
};

// ============================================================
// SNAKE
// ============================================================
let snake;

function initSnake() {
  snake = {
    body: [],
    direction:     DIR.RIGHT,
    nextDirection: null,
    prevBody: []  // for smooth interpolation
  };
  for (let i = 0; i < START_LENGTH; i++) {
    snake.body.push({ x: START_X - i, y: START_Y });
    snake.prevBody.push({ x: START_X - i, y: START_Y });
  }
}

function setDirection(newDir) {
  const compareDir = snake.nextDirection || snake.direction;
  if (newDir.x === -compareDir.x && newDir.y === -compareDir.y) return;
  if (newDir.x === compareDir.x && newDir.y === compareDir.y) return;
  snake.nextDirection = newDir;
}

// ============================================================
// FOOD
// ============================================================
let food = null;

function spawnFood() {
  const occupied = new Set(snake.body.map(s => s.x + ',' + s.y));
  const empty = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!occupied.has(x + ',' + y)) empty.push({ x, y });
    }
  }
  if (empty.length === 0) {
    transitionTo(STATES.GAME_OVER);
    triggerDeathEffects();
    return;
  }
  food = empty[Math.floor(Math.random() * empty.length)];
}

// ============================================================
// COLLISION (§4.3)
// ============================================================
function checkCollision(newHead, willEat) {
  const { x, y } = newHead;
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return 'WALL';
  const checkBody = willEat ? snake.body : snake.body.slice(0, -1);
  for (let i = 0; i < checkBody.length; i++) {
    if (checkBody[i].x === x && checkBody[i].y === y) return 'SELF';
  }
  return null;
}

// ============================================================
// GAME LOGIC — SNAKE TICK (§4.1)
// ============================================================
let score = 0;
let foodsEaten = 0;
let tickInterval = INITIAL_TICK;
let tickAccumulator = 0;
let lastFrameTime = 0;
let highScore = 0;

function snakeTick() {
  // Save prev positions for interpolation
  snake.prevBody = snake.body.map(s => ({ x: s.x, y: s.y }));

  if (snake.nextDirection) {
    snake.direction = snake.nextDirection;
    snake.nextDirection = null;
  }

  const head = snake.body[0];
  const newHead = {
    x: head.x + snake.direction.x,
    y: head.y + snake.direction.y
  };

  const willEat = food && newHead.x === food.x && newHead.y === food.y;
  const collision = checkCollision(newHead, willEat);

  if (collision) {
    triggerDeathEffects();
    transitionTo(STATES.GAME_OVER);
    return;
  }

  snake.body.unshift(newHead);

  if (willEat) {
    onEatFood(newHead);
  } else {
    snake.body.pop();
  }
}

function onEatFood(eatenPos) {
  score += BASE_POINTS;
  foodsEaten++;
  tickInterval = Math.max(MIN_TICK, INITIAL_TICK - foodsEaten * STEP_REDUCTION);

  // === Territory Expansion (§3) ===
  if (COLS < MAX_COLS || ROWS < MAX_ROWS) {
    expandGrid();      // grow grid, shift snake+food to keep center-relative pos
    resizeCanvasToFit();
  }
  // Food may have been shifted or grid changed — always re-spawn in new space
  spawnFood();

  spawnEatParticles(eatenPos.x * cellSize + cellSize / 2, eatenPos.y * cellSize + cellSize / 2);
  playEatSFX();
  screenFlash = 1.0;
  if (score > highScore) {
    highScore = score;
    Storage.setHighScore(highScore);
  }
}

// ============================================================
// TERRITORY EXPANSION (spec §3.3 — center-expand)
// Each food grows grid by +1 col / +1 row up to MAX_COLS/MAX_ROWS.
// Snake + food shift to preserve their center-relative position.
// ============================================================
function expandGrid() {
  const oldCols = COLS;
  const oldRows = ROWS;
  const newCols = Math.min(COLS + EXPAND_PER_FOOD, MAX_COLS);
  const newRows = Math.min(ROWS + EXPAND_PER_FOOD, MAX_ROWS);
  if (newCols === oldCols && newRows === oldRows) return; // at cap

  // Center-expand offset: how far the center shifts (usually +1 per expand).
  const leftShift = Math.floor(newCols / 2) - Math.floor(oldCols / 2);
  const topShift  = Math.floor(newRows / 2) - Math.floor(oldRows / 2);

  COLS = newCols;
  ROWS = newRows;

  // Shift snake body + prevBody (for interpolation continuity)
  if (snake) {
    for (let i = 0; i < snake.body.length; i++) {
      snake.body[i].x += leftShift;
      snake.body[i].y += topShift;
    }
    for (let i = 0; i < snake.prevBody.length; i++) {
      snake.prevBody[i].x += leftShift;
      snake.prevBody[i].y += topShift;
    }
  }
  // Shift food
  if (food) {
    food.x += leftShift;
    food.y += topShift;
  }
}

// ============================================================
// RESET
// ============================================================
function resetGame() {
  COLS = INITIAL_COLS;
  ROWS = INITIAL_ROWS;
  resizeCanvasToFit();
  initSnake();
  score = 0;
  foodsEaten = 0;
  tickInterval = INITIAL_TICK;
  tickAccumulator = 0;
  screenFlash = 0;
  shakeAmount = 0;
  snakeFlashColor = null;
  deathParticleTimer = 0;
  clearParticles();
  spawnFood();
}

// ============================================================
// STORAGE (§4.6)
// ============================================================
const Storage = {
  getHighScore() {
    try {
      const val = localStorage.getItem(HS_KEY);
      return val ? parseInt(val, 10) || 0 : 0;
    } catch (e) { return 0; }
  },
  setHighScore(s) {
    try { localStorage.setItem(HS_KEY, String(s)); } catch (e) {}
  },
  getMute() {
    try { return localStorage.getItem(MUTE_KEY) === 'true'; } catch (e) { return false; }
  },
  setMute(m) {
    try { localStorage.setItem(MUTE_KEY, String(m)); } catch (e) {}
  }
};

// ============================================================
// PARTICLE SYSTEM (§8.3)
// ============================================================
const particles = [];

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, color: null, size: 0 });
  }
}

function clearParticles() {
  for (let i = 0; i < particles.length; i++) particles[i].active = false;
}

function spawnParticle(x, y, color, opts) {
  opts = opts || {};
  for (let i = 0; i < particles.length; i++) {
    if (!particles[i].active) {
      const p = particles[i];
      p.active = true;
      p.x = x; p.y = y;
      p.vx = opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 6;
      p.vy = opts.vy !== undefined ? opts.vy : (Math.random() - 0.5) * 6;
      p.life = 1.0;
      p.color = color;
      p.size = opts.size || (cellSize * 0.15 + Math.random() * cellSize * 0.15);
      return;
    }
  }
}

function spawnEatParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
    const speed = 2 + Math.random() * 4;
    spawnParticle(x, y, PALETTE.food, {
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: cellSize * 0.12 + Math.random() * cellSize * 0.1
    });
  }
  for (let i = 0; i < 6; i++) {
    spawnParticle(x, y, PALETTE.accent, {
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      size: cellSize * 0.08 + Math.random() * cellSize * 0.08
    });
  }
}

function spawnDeathParticles() {
  for (const seg of snake.body) {
    const cx = seg.x * cellSize + cellSize / 2;
    const cy = seg.y * cellSize + cellSize / 2;
    for (let i = 0; i < 5; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 6;
      spawnParticle(cx, cy, PALETTE.snake, {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: cellSize * 0.1 + Math.random() * cellSize * 0.15
      });
    }
    // accent particles
    for (let i = 0; i < 2; i++) {
      spawnParticle(cx, cy, PALETTE.food, {
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4
      });
    }
  }
}

function updateParticles(dt) {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.93;
    p.vy *= 0.93;
    p.life -= dt / PARTICLE_LIFE;
    if (p.life <= 0) p.active = false;
  }
}

// ============================================================
// EFFECTS
// ============================================================
let screenFlash = 0;
let shakeAmount = 0;
let snakeFlashColor = null;
let snakeFlashTime = 0;
let deathParticleTimer = 0;

function triggerDeathEffects() {
  shakeAmount = 8;
  snakeFlashColor = PALETTE.food;
  snakeFlashTime = millis();
  spawnDeathParticles();
}

function applyScreenShake() {
  if (shakeAmount > 0.1) {
    translate(
      (Math.random() - 0.5) * shakeAmount * 2,
      (Math.random() - 0.5) * shakeAmount * 2
    );
    shakeAmount *= 0.88;
  }
}

// ============================================================
// AUDIO SYSTEM (§7)
// ============================================================
let audioReady = false;
let muted = false;

function initAudio() {
  if (audioReady) return;
  try {
    if (typeof getAudioContext === 'function') {
      const ctx = getAudioContext();
      if (ctx.state !== 'running') userStartAudio();
    }
    audioReady = true;
  } catch (e) {
    audioReady = false;
  }
}

function playEatSFX() {
  if (muted || !audioReady) return;
  try {
    const osc = new p5.Oscillator('square');
    const env = new p5.Envelope();
    env.setADSR(0.005, 0.04, 0.0, 0.01);
    env.setRange(0.15, 0);
    osc.freq(800 + Math.min(foodsEaten * 30, 400));
    osc.start();
    env.play(osc, 0, 0.05);
    setTimeout(() => { try { osc.stop(); } catch(e) {} }, 80);
  } catch(e) {}
}

function playDeathSFX() {
  if (muted || !audioReady) return;
  try {
    const osc = new p5.Oscillator('square');
    const env = new p5.Envelope();
    env.setADSR(0.01, 0.1, 0.0, 0.2);
    env.setRange(0.15, 0);
    osc.freq(400);
    osc.start();
    osc.freq(100, 0.3);
    env.play(osc, 0, 0.35);
    setTimeout(() => { try { osc.stop(); } catch(e) {} }, 400);
  } catch(e) {}
}

function playMenuSFX() {
  if (muted || !audioReady) return;
  try {
    const osc = new p5.Oscillator('square');
    const env = new p5.Envelope();
    env.setADSR(0.005, 0.06, 0.0, 0.01);
    env.setRange(0.1, 0);
    osc.freq(523);
    osc.start();
    env.play(osc, 0, 0.08);
    setTimeout(() => { try { osc.freq(784); } catch(e) {} }, 60);
    setTimeout(() => { try { osc.stop(); } catch(e) {} }, 180);
  } catch(e) {}
}

// Background music — chiptune loop
const MELODY = [
  { freq: 523, dur: 200 },  // C5
  { freq: 659, dur: 200 },  // E5
  { freq: 784, dur: 200 },  // G5
  { freq: 1047, dur: 200 }, // C6
  { freq: 784, dur: 200 },  // G5
  { freq: 659, dur: 200 },  // E5
  { freq: 587, dur: 200 },  // D5
  { freq: 698, dur: 200 },  // F5
  { freq: 880, dur: 200 },  // A5
  { freq: 1175, dur: 200 }, // D6
  { freq: 880, dur: 200 },  // A5
  { freq: 698, dur: 200 },  // F5
  { freq: 659, dur: 200 },  // E5
  { freq: 523, dur: 200 },  // C5
  { freq: 440, dur: 200 },  // A4
  { freq: 523, dur: 400 },  // C5 (held)
];

let melodyIndex = 0;
let nextNoteTime = 0;

function updateMusic() {
  if (muted || !audioReady || currentState !== STATES.PLAYING) return;
  const now = millis();
  if (now >= nextNoteTime) {
    const note = MELODY[melodyIndex];
    try {
      const osc = new p5.Oscillator('square');
      const env = new p5.Envelope();
      env.setADSR(0.01, 0.08, 0.0, 0.05);
      env.setRange(0.06, 0);
      osc.freq(note.freq);
      osc.start();
      env.play(osc, 0, note.dur / 1000 * 0.8);
      setTimeout(() => { try { osc.stop(); } catch(e) {} }, note.dur + 50);
    } catch(e) {}
    nextNoteTime = now + note.dur;
    melodyIndex = (melodyIndex + 1) % MELODY.length;
  }
}

// ============================================================
// CANVAS SIZING (§9)
// ============================================================
let cellSize = 0;
let canvasW = 0;
let canvasH = 0;

// ============================================================
// MOBILE CONTROLS V2 — Orientation + Tap Zone
// ============================================================

// Detect orientation from viewport. Portrait when tall >= wide.
// Square/desktop (~1:1) defaults to portrait (safe).
function getOrientation() {
  return windowWidth < windowHeight ? 'portrait' : 'landscape';
}

// 4-triangle tap zone: divide canvas by 2 diagonals, map the
// tap to whichever of UP/DOWN/LEFT/RIGHT it falls in.
function getTapZone(tx, ty) {
  const cx = canvasW / 2;
  const cy = canvasH / 2;
  const dx = tx - cx;
  const dy = ty - cy;
  if (Math.abs(dy) >= Math.abs(dx)) {
    return dy < 0 ? DIR.UP : DIR.DOWN;
  }
  return dx < 0 ? DIR.LEFT : DIR.RIGHT;
}

// Toggle CSS layout class + control mode visibility.
function switchControlMode(orient) {
  const body = document.body;
  if (orient === 'landscape') {
    body.classList.add('landscape');
    document.getElementById('gamepad').classList.remove('gamepad-hidden');
    document.getElementById('startBtn').classList.remove('start-hidden');
    // Hide topbar pause button (Start button takes over in landscape)
    document.getElementById('pauseBtn').style.display = 'none';
  } else {
    body.classList.remove('landscape');
    document.getElementById('gamepad').classList.add('gamepad-hidden');
    document.getElementById('startBtn').classList.add('start-hidden');
    document.getElementById('pauseBtn').style.display = '';
  }
}

function resizeCanvasToFit() {
  const margin = 8;
  const maxCanvas = 600;
  const vw = windowWidth;
  const vh = windowHeight;
  const hudHeight = 44;

  let availW, availH;
  if (getOrientation() === 'landscape') {
    // Landscape: canvas in center column. Subtract left (D-pad ~30%) and
    // right (Start ~24%) columns, plus gaps/padding.
    const sideCols = vw * 0.30 + vw * 0.24 + 24;
    availW = vw - sideCols;
    availH = vh - hudHeight - 16;
  } else {
    // Portrait: full width minus margins, minus topbar height.
    availW = vw - margin * 2;
    availH = vh - hudHeight - margin * 2;
  }

  let size = Math.min(availW, availH);
  size = Math.min(size, maxCanvas);
  size = Math.max(size, 200); // min playable size
  cellSize = Math.floor(size / Math.max(COLS, ROWS));
  canvasW = cellSize * COLS;
  canvasH = cellSize * ROWS;
  resizeCanvas(canvasW, canvasH);
}

// ============================================================
// RENDER HELPERS (§10.2)
// ============================================================
function drawWithGlow(drawFn, glowColor, blurRadius) {
  drawingContext.save();
  drawingContext.shadowBlur = blurRadius;
  drawingContext.shadowColor = glowColor;
  drawFn();
  drawingContext.restore();
}

// ============================================================
// RENDER PIPELINE (§6)
// ============================================================
function renderBackground() {
  background(PALETTE.bg);
}

function renderGrid() {
  push();
  stroke(PALETTE.grid);
  strokeWeight(1);
  noFill();
  for (let x = 0; x <= COLS; x++) {
    line(x * cellSize, 0, x * cellSize, canvasH);
  }
  for (let y = 0; y <= ROWS; y++) {
    line(0, y * cellSize, canvasW, y * cellSize);
  }
  pop();
}

// ============================================================
// SPIKE WALLS (spec §2) — visual danger border on all 4 edges.
// Triangular spikes point inward, neon red with glow. Visual only —
// collision logic unchanged (§2.3 COL-01). Spike penetration ≤ 35%
// cellSize into the playable area (§2.2 VIS-02). Shown in all states.
// ============================================================
const SPIKE_LENGTH_RATIO = 0.28;  // spike length / cellSize (into playable, under 35% cap to leave room for glow halo)
const SPIKE_BASE_RATIO = 0.4;     // spike base width / cellSize

function renderSpikeWalls() {
  const len = cellSize * SPIKE_LENGTH_RATIO;
  const halfBase = (cellSize * SPIKE_BASE_RATIO) / 2;

  drawWithGlow(() => {
    fill(PALETTE.spike);
    noStroke();

    // Top edge — spikes point DOWN (inward)
    for (let x = 0; x < COLS; x++) {
      const cx = x * cellSize + cellSize / 2;
      triangle(
        cx - halfBase, 0,
        cx + halfBase, 0,
        cx, len
      );
    }
    // Bottom edge — spikes point UP (inward)
    for (let x = 0; x < COLS; x++) {
      const cx = x * cellSize + cellSize / 2;
      triangle(
        cx - halfBase, canvasH,
        cx + halfBase, canvasH,
        cx, canvasH - len
      );
    }
    // Left edge — spikes point RIGHT (inward)
    for (let y = 0; y < ROWS; y++) {
      const cy = y * cellSize + cellSize / 2;
      triangle(
        0, cy - halfBase,
        0, cy + halfBase,
        len, cy
      );
    }
    // Right edge — spikes point LEFT (inward)
    for (let y = 0; y < ROWS; y++) {
      const cy = y * cellSize + cellSize / 2;
      triangle(
        canvasW, cy - halfBase,
        canvasW, cy + halfBase,
        canvasW - len, cy
      );
    }
  }, PALETTE.spike, Math.max(4, cellSize * 0.18));
}

function renderFood() {
  if (!food) return;
  const pulse = (Math.sin(millis() / 200) + 1) / 2;
  const scl = 0.8 + pulse * 0.4;
  const cx = food.x * cellSize + cellSize / 2;
  const cy = food.y * cellSize + cellSize / 2;
  const r = Math.max(2, (cellSize / 2 - 2) * scl);

  drawWithGlow(() => {
    fill(PALETTE.food);
    noStroke();
    circle(cx, cy, r * 2);
    // inner highlight
    fill(255, 255, 255, 100);
    circle(cx - r * 0.25, cy - r * 0.25, r * 0.6);
  }, PALETTE.food, 20);
}

function renderSnake() {
  if (!snake || snake.body.length === 0) return;
  const pulse = (Math.sin(millis() / 500) + 1) / 2;
  const glowR = 10 + pulse * 10;
  const interp = tickAccumulator / tickInterval;
  const t = Math.min(interp, 1);

  const isFlashing = snakeFlashColor && (millis() - snakeFlashTime < 200);
  const flashPulse = isFlashing ? (Math.sin((millis() - snakeFlashTime) / 30) + 1) / 2 : 0;
  const bodyColor = isFlashing ? lerpColor(color(PALETTE.snake), color(snakeFlashColor), flashPulse) : color(PALETTE.snake);

  drawWithGlow(() => {
    noStroke();

    for (let i = snake.body.length - 1; i >= 0; i--) {
      const seg = snake.body[i];
      const prev = snake.prevBody[i] || seg;
      const ix = lerp(prev.x, seg.x, t);
      const iy = lerp(prev.y, seg.y, t);

      const px = ix * cellSize;
      const py = iy * cellSize;
      const pad = Math.max(1, cellSize * 0.08);

      if (i === 0) {
        // Head
        fill(lerpColor(bodyColor, color(PALETTE.snakeHead), 0.5));
        rect(px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2, Math.max(2, cellSize * 0.15));
        // Eyes
        fill(PALETTE.white);
        const eyeOff = cellSize * 0.18;
        const eyeR = Math.max(1.5, cellSize * 0.08);
        const dx = snake.direction.x;
        const dy = snake.direction.y;
        // eye positions depend on direction
        const ex1 = px + cellSize / 2 + (-dy) * eyeOff + dx * eyeOff * 0.5;
        const ey1 = py + cellSize / 2 + (dx) * eyeOff + dy * eyeOff * 0.5;
        const ex2 = px + cellSize / 2 - (-dy) * eyeOff + dx * eyeOff * 0.5;
        const ey2 = py + cellSize / 2 - (dx) * eyeOff + dy * eyeOff * 0.5;
        circle(ex1, ey1, eyeR * 2);
        circle(ex2, ey2, eyeR * 2);
        // pupils
        fill(0);
        circle(ex1 + dx * eyeR * 0.3, ey1 + dy * eyeR * 0.3, eyeR);
        circle(ex2 + dx * eyeR * 0.3, ey2 + dy * eyeR * 0.3, eyeR);
      } else {
        const fade = Math.min(1, i / (snake.body.length + 2));
        fill(lerpColor(bodyColor, color(PALETTE.bg), fade * 0.15));
        rect(px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2, Math.max(1, cellSize * 0.1));
      }
    }
  }, isFlashing ? snakeFlashColor : PALETTE.snake, glowR);
}

function renderParticles() {
  push();
  blendMode(ADD);
  noStroke();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;
    const c = color(p.color);
    c.setAlpha(p.life * 200);
    fill(c);
    circle(p.x, p.y, p.size * p.life);
  }
  blendMode(BLEND);
  pop();
}

function renderJoystick() {
  if (!joystick.active) return;
  const baseRadius = Math.max(8, cellSize * JOYSTICK_BASE_RATIO);
  const thumbRadius = Math.max(5, cellSize * JOYSTICK_THUMB_RATIO);

  push();
  // Base ring — semi-transparent neon green
  noFill();
  stroke(0, 255, 136, 80);  // ~30% alpha
  strokeWeight(2);
  drawingContext.shadowBlur = 6;
  drawingContext.shadowColor = PALETTE.snake;
  circle(joystick.originX, joystick.originY, baseRadius * 2);

  // Thumb — solid neon green with glow
  drawingContext.shadowBlur = 10;
  noStroke();
  fill(PALETTE.snake);
  circle(joystick.thumbX, joystick.thumbY, thumbRadius * 2);

  // Reset shadow
  drawingContext.shadowBlur = 0;
  pop();
}

function renderHUD() {
  if (currentState === STATES.MENU) return;
  push();
  textAlign(LEFT, TOP);
  textSize(Math.max(12, cellSize * 0.5));
  textStyle(BOLD);

  // Score
  drawingContext.shadowBlur = 8;
  drawingContext.shadowColor = PALETTE.scoreText;
  fill(PALETTE.scoreText);
  text('SCORE ' + score, cellSize * 0.3, cellSize * 0.3);

  // Best
  textAlign(RIGHT, TOP);
  drawingContext.shadowColor = PALETTE.accent;
  fill(PALETTE.accent);
  text('BEST ' + highScore, canvasW - cellSize * 0.3, cellSize * 0.3);

  drawingContext.shadowBlur = 0;

  // Mute indicator
  if (muted) {
    textAlign(RIGHT, BOTTOM);
    textSize(Math.max(10, cellSize * 0.35));
    fill(255, 255, 255, 120);
    text('MUTED', canvasW - cellSize * 0.3, canvasH - cellSize * 0.3);
  }
  pop();
}

function renderScreenFlash() {
  if (screenFlash > 0.01) {
    push();
    noStroke();
    fill(255, 255, 255, screenFlash * 40);
    rect(0, 0, canvasW, canvasH);
    pop();
    screenFlash *= 0.82;
  }
}

function renderStateOverlay() {
  if (currentState === STATES.PLAYING) return;

  push();
  // Dim background
  if (currentState !== STATES.PAUSED) {
    noStroke();
    fill(10, 10, 15, 180);
    rect(0, 0, canvasW, canvasH);
  }

  textAlign(CENTER, CENTER);

  if (currentState === STATES.MENU) {
    drawTitle();
    drawPulsingText('TAP / SPACE TO PLAY', canvasH / 2 + cellSize * 2);
    textSize(Math.max(10, cellSize * 0.3));
    fill(255, 255, 255, 100);
    text('Arrow Keys / WASD / Swipe', canvasW / 2, canvasH / 2 + cellSize * 3.5);
    if (highScore > 0) {
      textSize(Math.max(11, cellSize * 0.35));
      fill(PALETTE.accent);
      text('BEST: ' + highScore, canvasW / 2, canvasH - cellSize * 2);
    }
  } else if (currentState === STATES.GAME_OVER) {
    // Death title
    push();
    drawingContext.shadowBlur = 20;
    drawingContext.shadowColor = PALETTE.food;
    fill(PALETTE.food);
    textSize(Math.max(20, cellSize * 1.0));
    textStyle(BOLD);
    text('GAME OVER', canvasW / 2, canvasH / 2 - cellSize * 1.5);
    pop();

    textSize(Math.max(13, cellSize * 0.55));
    fill(PALETTE.scoreText);
    text('Score: ' + score, canvasW / 2, canvasH / 2 + cellSize * 0.5);
    fill(PALETTE.accent);
    textSize(Math.max(11, cellSize * 0.4));
    text('Best: ' + highScore, canvasW / 2, canvasH / 2 + cellSize * 1.3);

    drawPulsingText('TAP / SPACE TO RETRY', canvasH / 2 + cellSize * 2.8);
  } else if (currentState === STATES.PAUSED) {
    push();
    drawingContext.shadowBlur = 15;
    drawingContext.shadowColor = PALETTE.scoreText;
    fill(PALETTE.scoreText);
    textSize(Math.max(18, cellSize * 0.9));
    textStyle(BOLD);
    text('PAUSED', canvasW / 2, canvasH / 2 - cellSize * 0.5);
    pop();
    drawPulsingText('TAP / SPACE TO RESUME', canvasH / 2 + cellSize * 1.5);
  }
  pop();
}

function drawTitle() {
  push();
  const titleSize = Math.max(22, cellSize * 1.2);
  textStyle(BOLD);
  textAlign(CENTER, CENTER);
  drawingContext.shadowBlur = 25;
  drawingContext.shadowColor = PALETTE.snake;
  fill(PALETTE.snake);
  textSize(titleSize);
  text('SNAKE', canvasW / 2, canvasH / 2 - cellSize * 1.5);
  drawingContext.shadowColor = PALETTE.food;
  fill(PALETTE.food);
  text('NEON', canvasW / 2, canvasH / 2 - cellSize * 0.2);
  pop();
}

function drawPulsingText(txt, y) {
  push();
  const pulse = (Math.sin(millis() / 400) + 1) / 2;
  textAlign(CENTER, CENTER);
  textSize(Math.max(11, cellSize * 0.42));
  textStyle(BOLD);
  fill(255, 255, 255, 100 + pulse * 155);
  text(txt, canvasW / 2, y);
  pop();
}

// ============================================================
// p5.js LIFECYCLE
// ============================================================
function setup() {
  pixelDensity(1);
  createCanvas(600, 600);   // create first, then resize
  resizeCanvasToFit();
  frameRate(60);
  drawingContext.imageSmoothingEnabled = false;

  highScore = Storage.getHighScore();
  muted = Storage.getMute();
  initParticles();
  initSnake();
  spawnFood();

  // Initialize mobile controls V2 orientation
  currentOrientation = getOrientation();
  switchControlMode(currentOrientation);

  // Auto-pause on tab blur (§5.5)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && currentState === STATES.PLAYING) {
      transitionTo(STATES.PAUSED);
    }
  });
}

function draw() {
  const now = millis();
  let dt = now - lastFrameTime;
  lastFrameTime = now;
  if (dt > 100) dt = 100; // clamp big gaps (tab switch)

  // Game logic tick (fixed-step accumulator)
  if (currentState === STATES.PLAYING) {
    tickAccumulator += dt;
    let safety = 0;
    while (tickAccumulator >= tickInterval && safety < 10) {
      snakeTick();
      tickAccumulator -= tickInterval;
      safety++;
      if (currentState !== STATES.PLAYING) break;
    }
    updateMusic();
  }

  // Update particles always (so death animation plays)
  updateParticles(dt);

  // Render
  push();
  applyScreenShake();
  renderBackground();
  renderGrid();
  renderSpikeWalls();
  renderFood();
  renderSnake();
  renderParticles();
  renderJoystick();
  renderScreenFlash();
  pop();

  renderHUD();
  renderStateOverlay();
}

// ============================================================
// INPUT — Keyboard (§5.4)
// ============================================================
function keyPressed() {
  const k = keyCode;

  // Direction keys
  if (k === UP_ARROW    || k === 87) setDirection(DIR.UP);
  if (k === DOWN_ARROW  || k === 83) setDirection(DIR.DOWN);
  if (k === LEFT_ARROW  || k === 65) setDirection(DIR.LEFT);
  if (k === RIGHT_ARROW || k === 68) setDirection(DIR.RIGHT);

  // State keys
  if (k === 32 || k === ENTER) {
    handleAction();
  }
  if (k === 80 || k === ESCAPE) {
    if (currentState === STATES.PLAYING) transitionTo(STATES.PAUSED);
    else if (currentState === STATES.PAUSED) transitionTo(STATES.PLAYING);
  }
  // Mute toggle
  if (k === 77) {
    muted = !muted;
    Storage.setMute(muted);
  }

  // Prevent default scroll for arrows/space
  if ([32, UP_ARROW, DOWN_ARROW, LEFT_ARROW, RIGHT_ARROW].includes(k)) {
    return false;
  }
}

// ============================================================
// INPUT — Touch / Mouse (§5.3)
// Floating Virtual Joystick: touch anywhere on canvas → virtual
// joystick appears at touch point → drag to steer. Tap (< threshold)
// does nothing while PLAYING (no accidental pause). On MENU/GAME_OVER/
// PAUSED overlays, tap still triggers handleAction (start/retry/resume).
// ============================================================
let touchStart = null;

function getTouchPos() {
  if (touches.length > 0) return { x: touches[0].x, y: touches[0].y };
  if (mouseIsPressed) return { x: mouseX, y: mouseY };
  return { x: mouseX, y: mouseY };
}

function applyJoystickDrag(tx, ty) {
  const dx = tx - joystick.originX;
  const dy = ty - joystick.originY;
  const baseRadius = Math.max(8, cellSize * JOYSTICK_BASE_RATIO);
  const threshold = Math.max(4, cellSize * JOYSTICK_THRESHOLD_RATIO);

  // Clamp thumb within base circle
  const mag = Math.sqrt(dx * dx + dy * dy);
  if (mag <= baseRadius) {
    joystick.thumbX = tx;
    joystick.thumbY = ty;
  } else {
    joystick.thumbX = joystick.originX + (dx / mag) * baseRadius;
    joystick.thumbY = joystick.originY + (dy / mag) * baseRadius;
  }

  // Direction change only past threshold
  if (Math.max(Math.abs(dx), Math.abs(dy)) >= threshold) {
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? DIR.RIGHT : DIR.LEFT);
    } else {
      setDirection(dy > 0 ? DIR.DOWN : DIR.UP);
    }
  }
}

function touchStarted() {
  initAudio();
  const pos = getTouchPos();

  if (currentState !== STATES.PLAYING) {
    // MENU / GAME_OVER / PAUSED — tap = action (both modes)
    touchStart = { x: pos.x, y: pos.y };
    return false;
  }

  // PLAYING
  if (currentOrientation === 'portrait') {
    // Portrait: record origin; tap zone resolved on touchEnded.
    // Also support swipe fallback (joystick visuals + drag direction).
    touchStart = { x: pos.x, y: pos.y };
    joystick.active = true;
    joystick.originX = pos.x;
    joystick.originY = pos.y;
    joystick.thumbX = pos.x;
    joystick.thumbY = pos.y;
  }
  // Landscape: canvas touch during PLAYING = nothing (D-pad handles it)
  return false;
}

function touchMoved() {
  // Portrait swipe fallback while PLAYING: drag > threshold → steer
  if (currentState === STATES.PLAYING && currentOrientation === 'portrait' && joystick.active) {
    const pos = getTouchPos();
    applyJoystickDrag(pos.x, pos.y);
  }
  return false;
}

function touchEnded() {
  if (currentState === STATES.PLAYING && currentOrientation === 'portrait' && touchStart) {
    const dx = mouseX - touchStart.x;
    const dy = mouseY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 12) {
      // Tap (no drag) → resolve 4-triangle tap zone
      const dir = getTapZone(touchStart.x, touchStart.y);
      setDirection(dir);
    }
    // else: swipe already handled in touchMoved
  }
  joystick.active = false;
  touchStart = null;
  return false;
}

function mousePressed() {
  initAudio();
  // Desktop mouse: treat click as action on overlays, ignore when playing
  // (desktop uses keyboard). Keeps click-to-start working.
  // (Pause button stops mousedown propagation so this never fires for it.)
  if (currentState !== STATES.PLAYING) {
    touchStart = { x: mouseX, y: mouseY };
  }
  return false;
}

function mouseReleased() {
  if (touchStart) {
    const dx = mouseX - touchStart.x;
    const dy = mouseY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 12) {
      handleAction();
    }
  }
  touchStart = null;
  return false;
}

// ============================================================
// ACTION HANDLER (tap/space/enter)
// ============================================================
function handleAction() {
  initAudio();

  if (currentState === STATES.MENU) {
    resetGame();
    transitionTo(STATES.PLAYING);
    playMenuSFX();
  } else if (currentState === STATES.GAME_OVER) {
    // Small delay to let death particles show
    resetGame();
    transitionTo(STATES.PLAYING);
    playMenuSFX();
  } else if (currentState === STATES.PAUSED) {
    transitionTo(STATES.PLAYING);
  } else if (currentState === STATES.PLAYING) {
    // Tap during play = pause (mobile convenience)
    transitionTo(STATES.PAUSED);
  }
}

// ============================================================
// RESIZE
// ============================================================
function windowResized() {
  const newOrient = getOrientation();
  if (newOrient !== currentOrientation) {
    currentOrientation = newOrient;
    switchControlMode(currentOrientation);
  }
  resizeCanvasToFit();
}

// ============================================================
// HUD — Pause button + score display (mobile-ux-redesign.md §4)
// Pause is an HTML button in topbar, NOT a canvas tap.
// ============================================================
(function initHUD() {
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('hud-score');

  function togglePause() {
    initAudio();
    if (currentState === STATES.PLAYING) {
      transitionTo(STATES.PAUSED);
    } else if (currentState === STATES.PAUSED) {
      transitionTo(STATES.PLAYING);
    }
  }

  if (pauseBtn) {
    // Dedupe touchstart + synthetic click (classic mobile double-fire):
    // when touchstart handles the interaction, suppress the click that follows.
    let lastTouchHandled = 0;

    const handleBtn = () => {
      if (currentState === STATES.MENU || currentState === STATES.GAME_OVER) {
        handleAction();
      } else {
        togglePause();
      }
    };

    // Stop mouse/touch events from bubbling to p5's global listeners so
    // the canvas mousePressed/mouseReleased never fire for button clicks.
    ['mousedown', 'mouseup', 'pointerdown', 'pointerup'].forEach(evType => {
      pauseBtn.addEventListener(evType, (e) => { e.stopPropagation(); }, { passive: true });
    });

    // touchstart with preventDefault + stopPropagation so the canvas
    // never sees the touch (no joystick activation from pause button)
    pauseBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      lastTouchHandled = Date.now();
      handleBtn();
    }, { passive: false });
    pauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Suppress the synthetic click fired right after touchstart
      if (Date.now() - lastTouchHandled < 500) return;
      handleBtn();
    });
  }

  // Update topbar score + pause label each frame
  function updateHUD() {
    if (scoreEl) {
      scoreEl.textContent = `SCORE ${score}  •  BEST ${highScore}`;
    }
    if (pauseBtn) {
      if (currentState === STATES.GAME_OVER) {
        pauseBtn.textContent = '↻ RESTART';
      } else if (currentState === STATES.MENU) {
        pauseBtn.textContent = '▶ START';
      } else if (currentState === STATES.PLAYING) {
        pauseBtn.textContent = '⏸ PAUSE';
      } else if (currentState === STATES.PAUSED) {
        pauseBtn.textContent = '▶ RESUME';
      }
    }
    // Landscape Start button label
    const startBtnEl = document.getElementById('startBtn');
    if (startBtnEl) {
      if (currentState === STATES.PLAYING) {
        startBtnEl.textContent = '⏸';
      } else {
        startBtnEl.textContent = '▶';
      }
    }
    requestAnimationFrame(updateHUD);
  }
  updateHUD();
})();

// ============================================================
// MOBILE CONTROLS V2 — D-pad + Start button (landscape)
// Uses touchstart + preventDefault to avoid double-fire and 300ms
// delay. stopPropagation keeps canvas touch handlers from firing.
// ============================================================
(function initGamepad() {
  function btnPress(btn) {
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 120);
  }

  // D-pad buttons
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    // Block all pointer/mouse events from bubbling to canvas
    ['mousedown', 'mouseup', 'pointerdown', 'pointerup'].forEach(evType => {
      btn.addEventListener(evType, (e) => { e.stopPropagation(); }, { passive: true });
    });
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      btnPress(btn);
      const dir = DIR[btn.dataset.dir];
      if (dir) setDirection(dir);
    }, { passive: false });
    // Suppress synthetic click after touchstart (no double-fire)
    btn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); });
  });

  // Start/Pause button
  const startBtn = document.getElementById('startBtn');
  if (startBtn) {
    ['mousedown', 'mouseup', 'pointerdown', 'pointerup'].forEach(evType => {
      startBtn.addEventListener(evType, (e) => { e.stopPropagation(); }, { passive: true });
    });
    startBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      btnPress(startBtn);
      // Start button acts as primary action in landscape
      handleAction();
    }, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); });
  }
})();

// Start p5 instance (script runs after p5.js loads, so auto-init already missed)
new p5();
</script>
</body>
</html>
